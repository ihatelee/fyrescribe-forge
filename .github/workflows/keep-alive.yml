name: Keep-alive

on:
  schedule:
    # 10:00 UTC every Monday
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lightweight REST query
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kxryozryqbajtgrfystu.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "REST API responded with status $status"
          if [ "$status" -ge 300 ]; then
            echo "Unexpected status code" >&2
            exit 1
          fi
